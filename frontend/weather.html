<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>CineMatch - Weather</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
<div class="app-container">
    <header>
        <h1>CineMatch</h1>
        <nav class="navbar">
            <a href="index.html">Recommendation Generator</a>
            <a href="search.html">Search</a>
            <a href="trending.html">Trending</a>
            <a href="upcoming.html">Upcoming</a>
            <a href="now-playing.html">Now Playing</a>
            <a href="weather.html">Weather</a>
        </nav>
    </header>

    <main>
        <section id="weatherSection">
            <form id="weatherForm">
                <h2>Current Weather</h2>
                <textarea id="weatherInput" rows="1" placeholder="Enter a city or zip code..." required></textarea>
                <div>
                    <button type="submit" id="weatherButton">Get Weather</button>
                </div>
            </form>

            <div id="statusMessage"></div>
        </section>

        <section id="resultsSection">
            <div class="weather-results-container">
                <div class="results-header">
                    <h2>Weather Results</h2>
                </div>
            </div>

            <div id="weatherResults" class="weather-results"></div>
            <div id="emptyState" class="empty-state" style="display: none;"></div>
        </section>
    </main>
</div>

<script>
    const API_BASE_URL = 'https://cinematch2-backend.onrender.com';
    const WEATHER_URL = `${API_BASE_URL}/current-weather`;

    const form = document.getElementById("weatherForm");
    const weatherInput = document.getElementById("weatherInput");
    const weatherButton = document.getElementById("weatherButton");
    const statusMessage = document.getElementById("statusMessage");
    const weatherResults = document.getElementById("weatherResults");
    const emptyState = document.getElementById("emptyState");

    function renderWeather(data) {
        weatherResults.innerHTML = "";

        if (!data || data.error) {
            emptyState.style.display = "block";
            emptyState.textContent = data?.error || "No weather data found.";
            return;
        }

        emptyState.style.display = "none";

        weatherResults.innerHTML = `
                <div class="weather-card">
                    <h3>${data.location?.name || "Unknown Location"}, ${data.location?.region || ""}</h3>
                    <p><strong>Condition:</strong> ${data.current?.condition?.text || "N/A"}</p>
                    <p><strong>Temperature:</strong> ${data.current?.temp_f ?? "N/A"}°F / ${data.current?.temp_c ?? "N/A"}°C</p>
                    <p><strong>Feels Like:</strong> ${data.current?.feelslike_f ?? "N/A"}°F / ${data.current?.feelslike_c ?? "N/A"}°C</p>
                    <p><strong>Humidity:</strong> ${data.current?.humidity ?? "N/A"}%</p>
                    <p><strong>Wind:</strong> ${data.current?.wind_mph ?? "N/A"} mph</p>
                </div>
            `;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const location = weatherInput.value.trim();
        if (!location) return;

        weatherButton.disabled = true;
        statusMessage.textContent = "Loading weather...";
        weatherResults.innerHTML = "";
        emptyState.style.display = "none";

        try {
            const response = await fetch(`${WEATHER_URL}?city=${encodeURIComponent(location)}`);

            if (!response.ok) {
                throw new Error("Weather request failed");
            }

            const data = await response.json();
            renderWeather(data);
            statusMessage.textContent = "";
        } catch (error) {
            console.error(error);
            statusMessage.textContent = "Something went wrong.";
            emptyState.style.display = "block";
            emptyState.textContent = "Failed to load weather.";
        } finally {
            weatherButton.disabled = false;
        }
    });
</script>
</body>

</html>
